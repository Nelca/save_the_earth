<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ちいさな地球の治しかた — SAVE THE EARTH</title>
<style>
:root{
  --night:#0a0f1c;
  --night2:#1b2532;
  --panel:#212d3b;
  --panel-edge:#38495c;
  --panel-hi:rgba(255,255,255,.05);
  --glass:rgba(27,37,50,.86);
  --ink:#f2f5f3;
  --ink-dim:#a7bcc0;
  --ink-faint:#6c8188;
  --heal:#7ee0ab;
  --heal-deep:#2f6b52;
  --hurt:#ef9274;
  --hurt-deep:#7a3d2c;
  --sky:#6cb8ee;
  --gold:#f0cf87;
  --gold-deep:#8a6b2c;
  --card-bg-1:#2a3a48; --card-bg-2:#1d2934; --card-edge:#44607a;
  --paper:#f6efdd;
  --paper2:#efe5cc;
  --paper-ink:#41372a;
  --gothic:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo',sans-serif;
  --mincho:'Hiragino Mincho ProN','Yu Mincho','YuMincho','MS PMincho',serif;

  /* ============================================================
     重なり順(z-index)一覧 ― 新しいオーバーレイを追加する時は、
     ここに追記してから値を参照すること。数字が大きいほど手前。
     個別の要素に直接マジックナンバーを書かず、必ずこの変数を使う。
     ------------------------------------------------------------
     --z-bg        背景演出(星空canvas)
     --z-app       アプリ本体・通常の画面
     --z-fx        盤面の小さな演出(ポップアップ数値など)
     --z-envelope  ホーム画面の封筒
     --z-nav1      ミッション選択の導線(ブリーフ / ドメイン一覧)
     --z-dilemma   ジレンマ
     --z-event     できごと
     --z-result    結果画面
     --z-letter    手紙
     --z-list      一覧系モーダル(カード帳・スキル・合成・デッキ編集。#modal-bg)
     --z-detail    カード詳細シート(#sheet-bg)。一覧系モーダルより必ず手前。
     --z-drag      ドラッグ中のカード(最前面)
     ============================================================ */
  --z-bg:0; --z-app:1; --z-fx:15; --z-envelope:20;
  --z-nav1:40; --z-dilemma:50; --z-event:52; --z-result:55; --z-letter:60;
  --z-list:70; --z-detail:75; --z-drag:100;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:var(--night);
  color:var(--ink);
  font-family:var(--gothic);
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
#bg-canvas{position:fixed;inset:0;z-index:var(--z-bg);pointer-events:none}
#bg-grain{position:fixed;inset:0;z-index:var(--z-bg);pointer-events:none;opacity:.045;mix-blend-mode:overlay}
#app{max-width:560px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;z-index:var(--z-app)}
@media(min-width:700px){
  #app{box-shadow:0 0 0 1px var(--panel-edge),0 0 120px rgba(10,15,28,.8)}
}
button{font-family:var(--gothic);cursor:pointer;border:none;color:inherit;background:none}
.btn{
  background:linear-gradient(180deg,#49e0ac,#23a97b);
  color:#04301f;font-weight:800;font-size:16px;letter-spacing:.04em;
  padding:14px 32px;border-radius:999px;
  box-shadow:0 4px 0 #167a56, 0 10px 28px rgba(63,214,163,.35);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #167a56}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink-dim);box-shadow:none;border:1.5px solid var(--panel-edge);font-weight:700}
.btn.gold{background:linear-gradient(180deg,#ffd97a,#e0a832);color:#4a3200;box-shadow:0 4px 0 #a97b1c,0 10px 28px rgba(245,196,81,.35)}
.btn:disabled{filter:grayscale(.9);opacity:.45;pointer-events:none}

@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}

.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:1;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px)}
.screen.active{display:flex;animation:scrIn .45s ease-out}
@keyframes scrIn{from{opacity:0}to{opacity:1}}

/* ============ INTRO ============ */
#scr-intro{align-items:center;justify-content:center;gap:26px;text-align:center}
.intro-cap{font-family:var(--mincho);font-size:15px;color:var(--ink-dim);letter-spacing:.15em;line-height:2.2;min-height:66px}
.parcel-wrap{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.parcel{width:170px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));transition:transform .2s}
.parcel-wrap:active .parcel{transform:scale(.97)}
.parcel-wrap.shake .parcel{animation:pshake .5s}
@keyframes pshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.parcel-wrap.burst .parcel{animation:pop .6s forwards}
@keyframes pop{40%{transform:scale(1.12)}100%{transform:scale(0);opacity:0}}
.flash{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,#fff8e0 0%,rgba(255,244,200,.35) 35%,transparent 70%);opacity:0;pointer-events:none}
.parcel-wrap.burst .flash{animation:flash .9s ease-out}
@keyframes flash{20%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.intro-earth{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.3) translateY(30px);transition:all 1s cubic-bezier(.2,.9,.3,1.2)}
.intro-earth.show{opacity:1;transform:scale(1) translateY(0)}
.intro-earth .earth-holder{width:220px}
.tap-pulse{font-size:12px;color:var(--ink-dim);animation:tw 1.8s infinite;letter-spacing:.2em}

/* ============ LETTER ============ */
.letter-bg{position:absolute;inset:0;z-index:var(--z-letter);display:none;align-items:center;justify-content:center;background:rgba(4,7,18,.8);backdrop-filter:blur(3px)}
.letter-bg.show{display:flex}
.letter{
  width:88%;max-width:420px;max-height:80%;overflow-y:auto;
  background:
    linear-gradient(rgba(120,90,40,.05) 1px, transparent 1px) 0 0/100% 34px,
    linear-gradient(160deg,var(--paper),var(--paper2));
  color:var(--paper-ink);border-radius:4px;padding:34px 28px 28px;font-family:var(--mincho);
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 60px rgba(160,120,60,.12);
  position:relative;animation:letterIn .6s ease-out;
}
@keyframes letterIn{from{transform:translateY(50px) rotate(1.5deg);opacity:0}to{transform:none;opacity:1}}
.letter::before{content:'';position:absolute;top:12px;right:14px;width:52px;height:52px;border:2px solid rgba(190,60,40,.45);border-radius:50%;
  background:radial-gradient(circle at 50% 42%, rgba(190,60,40,.14), transparent 65%)}
.letter::after{content:'万国郵便 ✦ 2126';position:absolute;top:30px;right:8px;width:64px;text-align:center;font-size:8px;color:rgba(190,60,40,.6);transform:rotate(-12deg)}
.letter .l-line{font-size:14.5px;line-height:2.35;letter-spacing:.06em;opacity:0;transform:translateY(6px);transition:all .7s;white-space:pre-wrap}
.letter .l-line.on{opacity:1;transform:none}
.letter .l-line.whisper{color:#7a6a4f;font-style:italic}
.letter .l-sign{text-align:right;margin-top:14px;font-size:14px}
.letter-actions{margin-top:20px;display:flex;justify-content:center}
.letter-actions .btn{font-family:var(--gothic)}

/* ============ HOME ============ */
#scr-home{align-items:center;gap:6px}
.home-top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.home-title{font-family:var(--mincho);font-size:16px;letter-spacing:.14em}
.home-sub{font-size:10.5px;color:var(--ink-dim);letter-spacing:.08em;margin-top:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(180deg,var(--panel),var(--night2));
  border:1px solid var(--panel-edge);display:flex;align-items:center;justify-content:center;position:relative;
  color:var(--ink-dim);box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 1px 0 var(--panel-hi)}
.icon-btn .icon{width:18px;height:18px}
.icon-btn .ibtn-num{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:99px;
  background:linear-gradient(180deg,#fce3a8,var(--gold));color:#3a2b06;font-size:9px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:var(--gothic);
  box-shadow:0 2px 5px rgba(0,0,0,.4)}
.icon-btn.pulse{animation:btnPulse 1.6s ease-in-out infinite;border-color:var(--gold)}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,207,135,.5)}50%{box-shadow:0 0 0 7px rgba(240,207,135,0)}}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.home-top .right{display:flex;gap:8px}

#earth-stagearea{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#earth-wrap{width:min(94vw,460px);transition:transform .7s cubic-bezier(.3,.8,.3,1);cursor:pointer;position:relative}
#earth-wrap.inspect{transform:scale(1.1)}
#earth-wrap .earth-holder{width:100%}
.earth-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;font-size:12px;color:var(--ink-dim);
  background:var(--glass);border:1px solid var(--panel-edge);padding:7px 16px;border-radius:999px;white-space:nowrap;
  animation:hintFloat 2.4s ease-in-out infinite;pointer-events:none}
@keyframes hintFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}

.heal-meter{width:min(78%,320px);display:flex;flex-direction:column;align-items:center;gap:5px;padding-bottom:4px}
.heal-bar{width:100%;height:10px;border-radius:99px;background:var(--night2);border:1px solid var(--panel-edge);overflow:hidden}
.heal-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff8a5e,var(--gold),var(--heal));transition:width 1.2s ease}
.heal-label{font-size:11px;color:var(--ink-dim);letter-spacing:.08em;text-align:center;line-height:1.7}
.heal-label b{color:var(--heal)}
.heal-label .dom{color:var(--sky)}

.envelope{position:absolute;left:50%;bottom:104px;transform:translate(-50%,80px);z-index:var(--z-envelope);
  background:linear-gradient(160deg,var(--paper),var(--paper2));color:var(--paper-ink);
  border-radius:12px;padding:12px 20px;display:flex;gap:10px;align-items:center;font-family:var(--mincho);font-size:13.5px;
  box-shadow:0 16px 40px rgba(0,0,0,.55);cursor:pointer;opacity:0;transition:all .6s cubic-bezier(.2,.8,.3,1.2)}
.envelope.show{transform:translate(-50%,0);opacity:1}
.envelope .env-icon{font-size:22px;animation:hintFloat 2s infinite}

/* ============ EARTH (rotating realistic globe) ============ */
.earth-holder{position:relative;line-height:0}
.earth{width:100%;display:block;overflow:visible;position:relative;z-index:2}
.globe-clip-div{position:absolute;left:10.667%;top:10.667%;width:78.667%;height:78.667%;
  border-radius:50%;overflow:hidden;z-index:1}
.globe-clip-div svg{display:block;width:100%;height:100%}
/* saturation veil driven by --sick (1=fully sick .. 0=healthy), set inline */
.globe-tint{transition:opacity 1.8s ease}
.globe-smog{transition:opacity 1.8s ease}
.rot-layer{animation:spin 46s linear infinite}
@keyframes spin{from{transform:translateX(0)}to{transform:translateX(var(--tilew))}}
.cloud-layer{animation:spinc 62s linear infinite;opacity:.5}
@keyframes spinc{from{transform:translateX(0)}to{transform:translateX(var(--tilew))}}
/* domain symptom aura on static front layer */
.symptom{transition:opacity 1.6s ease}
.marker{cursor:pointer}
.marker .m-ring{fill:none;stroke-width:2;opacity:.9}
.marker .m-bg{stroke-width:1.6}
.marker.avail .m-ring{stroke:var(--gold);animation:ringPulse 1.7s ease-out infinite}
.marker.avail .m-bg{fill:#241c08;stroke:var(--gold)}
.marker.part .m-bg{fill:var(--night2);stroke:var(--sky)}
.marker.part .m-ring{stroke:var(--sky);opacity:.5}
.marker.locked{opacity:.34;filter:grayscale(1)}
.marker.locked .m-bg{fill:var(--night2);stroke:var(--panel-edge)}
.marker.done .m-bg{fill:var(--heal-deep);stroke:var(--heal)}
.marker.done .m-ring{stroke:var(--heal);opacity:.4}
@keyframes ringPulse{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.marker .m-ring{transform-box:fill-box;transform-origin:center}
.marker text{pointer-events:none}
.spark{fill:#fff6c9;opacity:0}
@keyframes sparkle{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
.spark{transform-box:fill-box;transform-origin:center}
/* unlock light beam */
.beam{stroke:var(--gold);stroke-width:2;fill:none;stroke-linecap:round;opacity:0;filter:url(#beamGlow)}
.beam.fire{animation:beamFire 1.6s ease-out forwards}
@keyframes beamFire{0%{opacity:0;stroke-dashoffset:var(--blen)}30%{opacity:.95}70%{opacity:.95;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}

/* ============ PLAY ============ */
#scr-play{gap:8px;padding-top:calc(env(safe-area-inset-top) + 8px)}
.hud{display:flex;align-items:center;gap:10px}
.hud-mission{display:flex;flex-direction:column;gap:2px;min-width:0}
.hud-mission .hm-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-mission .hm-axis{font-size:9.5px;color:var(--ink-dim)}
.hud .spacer{flex:1}

.timebar{display:flex;align-items:center;gap:7px}
.timebar .hourglass{font-size:16px}
.pips{display:flex;gap:4px}
.pip{width:11px;height:16px;border-radius:4px;background:var(--night2);border:1px solid var(--panel-edge);transition:all .4s;position:relative}
.pip.ev::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#a88be8;box-shadow:0 0 5px #a88be8}
.pip.left{background:linear-gradient(180deg,#ffd97a,#e0a832);border-color:#a97b1c;box-shadow:0 0 6px rgba(245,196,81,.4)}
.pip.now{animation:pipPulse 1.2s infinite}
@keyframes pipPulse{50%{transform:scaleY(1.25);box-shadow:0 0 12px rgba(245,196,81,.8)}}
.time-label{font-size:11px;color:var(--gold);font-weight:800;white-space:nowrap}
.time-label.urgent{color:var(--hurt)}
.hh-deck{font-weight:700;color:var(--ink-dim);font-size:10px;margin-left:2px}
.hand.wait{opacity:.55;pointer-events:none;transition:opacity .25s}
@keyframes bshake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.board.shake{animation:bshake .5s}

.gauges{display:flex;gap:10px}
.gauge{flex:1;background:var(--glass);border:1px solid var(--panel-edge);border-radius:12px;padding:7px 10px 8px}
.gauge .g-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.gauge .g-head span{display:flex;align-items:center;gap:5px;color:var(--ink-dim)}
.gauge .g-head span .icon{width:13px;height:13px}
.gauge .g-head b{font-size:13px}
.gauge .g-bar{height:11px;background:var(--night);border-radius:99px;overflow:hidden;position:relative}
.gauge .g-bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.3,.8,.4,1)}
.gauge .g-target{position:absolute;top:-2px;bottom:-2px;width:2.5px;background:#fff;opacity:.9;border-radius:2px}
.g-bar-wrap{position:relative;padding-bottom:14px}
.g-tnum{position:absolute;top:12px;transform:translateX(-50%);font-size:9.5px;font-weight:800;color:var(--ink-dim);opacity:.9;transition:color .4s;white-space:nowrap}
.g-tnum.ok{color:var(--heal)}
.g-tnum::before{content:'▲';display:block;text-align:center;font-size:6px;line-height:5px;opacity:.7}
#g-env i{background:linear-gradient(90deg,#2f6fa8,var(--sky))}
#g-life i{background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.gauge.bump b{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}

.board{position:relative;
  border:1.5px solid var(--panel-edge);border-radius:18px;padding:0;overflow:hidden;isolation:isolate;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.55);
  transition:box-shadow .25s, border-color .25s}
.board.drop-hot{border-color:var(--heal);box-shadow:0 0 0 3px rgba(63,214,163,.25), 0 0 40px rgba(63,214,163,.25) inset}
.board-bg-art{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.board-scrim{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse 90% 75% at 50% 46%, rgba(10,16,24,.3) 0%, rgba(9,14,21,.64) 72%, rgba(7,11,17,.82) 100%)}
.board-svg-fg{position:relative;z-index:2;width:100%;display:block}
.board .drop-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:14px;font-weight:800;color:var(--heal);opacity:0;transition:opacity .2s;letter-spacing:.1em;
  background:rgba(10,15,36,.35);z-index:3}
.board.drop-hot .drop-hint{opacity:1}
.board.combo-flash::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 50% 46%, rgba(240,207,135,.55), transparent 65%);
  animation:comboFlash .6s ease-out}
@keyframes comboFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#f-load,#f-care{transition:stroke-width .6s ease}
.envnode{transition:stroke .8s ease}
.bnode-icon{stroke:var(--ink-dim);fill:none;stroke-width:1.6}
.envnode.flash{animation:envFlash .8s}
@keyframes envFlash{30%{filter:drop-shadow(0 0 12px var(--heal))}}

.pop{position:absolute;font-weight:900;font-size:15px;pointer-events:none;z-index:var(--z-fx);
  text-shadow:0 2px 8px rgba(0,0,0,.7);animation:popRise 1.5s ease-out forwards;white-space:nowrap}
@keyframes popRise{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.15)}30%{transform:translate(-50%,-8px) scale(1)}100%{opacity:0;transform:translate(-50%,-46px)}}

.log-line{font-size:11.5px;color:var(--ink-dim);text-align:center;min-height:18px;line-height:1.55;padding:0 4px}
.log-line b{color:var(--ink)}
.log-line .combo{color:var(--gold);font-weight:900}

.hand-wrap{margin-top:auto;display:flex;flex-direction:column;gap:7px}
.hand-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-dim);padding:0 4px;gap:8px}
.hint-btn{background:rgba(168,139,232,.18);border:1px solid rgba(168,139,232,.4);color:#c9b6f0;border-radius:99px;
  padding:3px 10px;font-size:10.5px;font-weight:700;white-space:nowrap}
.hint-btn:active{transform:scale(.96)}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:140px}
.card{
  background:linear-gradient(180deg,var(--card-bg-1),var(--card-bg-2));
  color:var(--ink);border-radius:7px;display:flex;flex-direction:column;position:relative;
  border:1px solid #0a0f14;
  box-shadow:0 8px 16px -6px rgba(0,0,0,.6), 0 2px 3px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.05);
  min-height:140px;touch-action:none;transition:transform .15s, opacity .15s, box-shadow .15s;
}
.card::after{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,.07);border-radius:3px;pointer-events:none}
.card.dragging-src{opacity:.25;transform:scale(.94)}
.card.combo-ready{box-shadow:0 8px 16px -6px rgba(0,0,0,.6), 0 0 0 1.5px var(--heal), 0 0 14px -2px rgba(126,224,171,.55)}
.card.combo-ready::before{content:'コンボ!';position:absolute;top:-9px;right:-5px;background:var(--heal);color:#04301f;
  font-size:9px;font-weight:900;padding:2px 7px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:3}
.card.evolved{box-shadow:0 8px 16px -6px rgba(0,0,0,.6), 0 0 0 1.5px #a88be8, 0 0 14px -2px rgba(168,139,232,.5)}
.card.evolved::after{border-color:rgba(168,139,232,.35)}
.card .c-evo-badge{display:none}
.card.evolved .c-evo-badge{display:block;position:absolute;top:-9px;left:-5px;background:#a88be8;color:#2a1c4a;
  font-size:9px;font-weight:900;padding:2px 7px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:3}
.card.new-deal{animation:deal .45s cubic-bezier(.2,.8,.3,1.15)}
@keyframes deal{from{transform:translateY(70px) rotate(6deg);opacity:0}}
.card .c-art{position:relative;height:46%;min-height:52px;display:flex;align-items:center;justify-content:center;
  border-radius:6px 6px 0 0;overflow:hidden}
.card .c-art-icon{font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.card .c-tagdot{position:absolute;top:5px;left:5px;font-size:7px;color:#0c130f;
  padding:2px 6px;border-radius:3px;font-weight:900;letter-spacing:.02em;box-shadow:0 2px 4px rgba(0,0,0,.35);z-index:2}
.card .c-body{padding:6px 7px 7px;display:flex;flex-direction:column;flex:1;gap:5px}
.card .c-name{font-family:var(--mincho);font-size:10.5px;line-height:1.35;font-weight:600;min-height:26px}
.card .c-fx{display:flex;flex-direction:column;gap:2.5px;margin-top:auto;border-top:1px dashed rgba(255,255,255,.09);padding-top:5px}
.card .fx-row{display:flex;align-items:center;gap:3px;font-size:8.8px;color:var(--ink-dim);font-weight:600}
.card .fx-row .icon{width:9px;height:9px;flex:none}
.card .fx-row.good{color:var(--heal)}
.card .fx-row.bad{color:var(--hurt)}
.card .fx-dur{font-size:7.5px;color:var(--ink-faint);margin-left:auto;font-style:normal}
.c-art.tag-policy{background:linear-gradient(155deg,#2a4a7a,#14243c)}
.c-art.tag-tech{background:linear-gradient(155deg,#4a3a7a,#221c3c)}
.c-art.tag-citizen{background:linear-gradient(155deg,#6b4a2a,#2e2010)}
.c-art.tag-nature{background:linear-gradient(155deg,#2d5a45,#15291f)}
.c-art.tag-econ{background:linear-gradient(155deg,#7a3550,#2e1420)}
.tag-policy{background:#5b7fd4}.tag-tech{background:#8a63d2}.tag-citizen{background:#e08b3d}
.tag-nature{background:#3ba576}.tag-econ{background:#c25577}
.hand-tip{font-size:10px;color:var(--ink-dim);text-align:center}

#drag-ghost{position:fixed;z-index:var(--z-drag);pointer-events:none;width:92px;transform:translate(-50%,-60%) rotate(4deg) scale(1.1);
  filter:drop-shadow(0 16px 24px rgba(0,0,0,.5));display:none}
#drag-ghost .card{min-height:120px}

/* ============ overlays ============ */
.sheet-bg{position:absolute;inset:0;background:rgba(4,7,18,.72);display:none;align-items:flex-end;justify-content:center}
/* 同じ .sheet-bg を使う3要素は役割が異なるため、重なり順は個別に指定する */
#dom-bg,#brief-bg{z-index:var(--z-nav1)}
#sheet-bg{z-index:var(--z-detail)} /* 一覧系モーダル(--z-list)の中から開かれても必ず手前に出す */
.sheet-bg.show{display:flex}
.sheet{background:var(--panel);border-top:2px solid var(--panel-edge);border-radius:22px 22px 0 0;
  width:100%;max-width:560px;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:82%;overflow-y:auto;
  animation:up .3s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-tag{font-size:10px;font-weight:800;padding:3px 10px;border-radius:99px;color:#fff}
.d-desc{font-size:13px;line-height:1.9;color:var(--ink-dim);margin:12px 0}
.d-fx{background:var(--night2);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:2}
.d-fx .icon{vertical-align:-2px;color:var(--ink-dim)}
.d-fx b{color:var(--heal)}
.d-fx .bad{color:var(--hurt)}
.d-combo{margin-top:10px;font-size:11.5px;color:var(--gold);line-height:1.7}
.d-fact{margin-top:12px;background:rgba(108,184,238,.08);border:1px solid rgba(108,184,238,.25);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.85;color:var(--ink-dim)}
.d-fact::before{content:'💡 現実の世界では';display:block;font-weight:800;color:var(--sky);margin-bottom:4px;font-size:11px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;padding:13px;font-size:14px}

/* domain sheet (前編/後編選択) */
.dom-head{display:flex;align-items:center;gap:12px}
.dom-head .dh-icon{font-size:36px}
.dom-head .dh-name{font-size:18px;font-weight:800;font-family:var(--mincho);letter-spacing:.05em}
.dom-head .dh-axis{font-size:10px;color:var(--ink-dim);margin-top:3px}
.dom-desc{font-size:12.5px;line-height:1.95;color:var(--ink-dim);margin:12px 0 8px}
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{width:100%;text-align:left;background:rgba(255,255,255,.04);border:1.5px solid var(--panel-edge);border-radius:14px;
  padding:13px 15px;color:var(--ink);transition:all .15s;display:flex;gap:12px;align-items:center}
.mrow:active{transform:scale(.985)}
.mrow.avail{border-color:var(--gold)}
.mrow.done{border-color:#1c5c46;background:rgba(15,52,40,.5)}
.mrow.locked{opacity:.5;pointer-events:none}
.mrow .mr-badge{font-size:22px;flex-shrink:0}
.mrow .mr-name{font-weight:800;font-size:14px}
.mrow .mr-sub{font-size:10.5px;color:var(--ink-dim);margin-top:3px;line-height:1.5}
.mrow .mr-state{margin-left:auto;font-size:10px;font-weight:800;flex-shrink:0}
.mrow.avail .mr-state{color:var(--gold)}
.mrow.done .mr-state{color:var(--heal)}
.mrow.locked .mr-state{color:var(--ink-dim)}

/* mission brief */
.brief-head{display:flex;align-items:center;gap:12px}
.brief-head .b-icon{font-size:38px}
.brief-head .b-name{font-size:18px;font-weight:800;font-family:var(--mincho);letter-spacing:.05em}
.brief-head .b-axis{font-size:10px;color:var(--ink-dim);margin-top:3px}
.brief-desc{font-size:13px;line-height:2;color:var(--ink-dim);margin:14px 0 12px}
.goal-row{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;background:var(--night2);border-radius:12px;padding:10px 13px;line-height:1.7;margin-bottom:8px}
.goal-row b{color:var(--sky)}
.goal-row.resident-row{background:rgba(168,139,232,.12);border:1px solid rgba(168,139,232,.3)}
.goal-row.resident-row b{color:#a88be8}

/* dilemma + event (shared visual) */
.dilemma-bg{position:absolute;inset:0;background:rgba(4,7,18,.84);z-index:var(--z-dilemma);display:none;align-items:center;justify-content:center;padding:20px}
.dilemma-bg.show{display:flex}
.dilemma{background:linear-gradient(170deg,var(--panel),var(--night2));border:1.5px solid #6a5a9c;border-radius:20px;
  padding:24px 20px;width:100%;max-width:400px;animation:up .35s cubic-bezier(.2,.8,.3,1)}
.dilemma .dl-badge{font-size:10px;color:#c9b6f0;letter-spacing:.25em;text-align:center;margin-bottom:8px}
.dilemma h3{font-size:17px;text-align:center;margin-bottom:10px}
.dilemma .dl-text{font-size:13px;line-height:1.95;color:var(--ink-dim);margin-bottom:16px}
.dl-opt{width:100%;text-align:left;background:rgba(255,255,255,.05);border:1.5px solid #4a3f6c;border-radius:14px;
  padding:13px 15px;margin-bottom:10px;color:var(--ink);transition:all .15s}
.dl-opt:active{transform:scale(.98);border-color:#c9b6f0}
.dl-opt .o-name{font-weight:800;font-size:13.5px}
.dl-opt .o-fx{font-size:11px;color:#a89bc4;margin-top:4px;line-height:1.6}

/* event modal */
.event-bg{position:absolute;inset:0;background:rgba(4,7,18,.84);z-index:var(--z-event);display:none;align-items:center;justify-content:center;padding:20px}
.event-bg.show{display:flex}
.eventc{background:linear-gradient(170deg,var(--panel),var(--night2));border:1.5px solid var(--panel-edge);border-radius:20px;
  padding:24px 20px;width:100%;max-width:400px;animation:up .35s cubic-bezier(.2,.8,.3,1)}
.eventc .ev-badge{font-size:10px;color:var(--ink-faint);letter-spacing:.25em;text-align:center;margin-bottom:10px}
.eventc .ev-icon{font-size:40px;text-align:center;line-height:1;margin-bottom:6px}
.eventc h3{font-size:17px;text-align:center;margin-bottom:10px;font-family:var(--mincho)}
.eventc .ev-text{font-size:13px;line-height:1.9;color:var(--ink-dim);margin-bottom:12px;text-align:center}
.ev-impact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.ev-imp{font-size:12px;font-weight:800;padding:5px 13px;border-radius:99px;background:var(--night2);border:1px solid var(--panel-edge)}
.ev-imp.bad{color:var(--hurt);border-color:var(--hurt-deep);background:rgba(122,61,44,.35)}
.ev-imp.good{color:var(--heal);border-color:var(--heal-deep);background:rgba(47,107,82,.35)}
.ev-imp.boost{color:var(--gold);border-color:var(--gold-deep);background:rgba(138,107,44,.3)}
.eventc .ev-fact{background:rgba(108,184,238,.08);border:1px solid rgba(108,184,238,.25);border-radius:12px;padding:11px 13px;font-size:11.5px;line-height:1.8;color:var(--ink-dim);margin-bottom:16px}
.eventc .ev-fact::before{content:'💡 ';}
.eventc .btn{width:100%}

/* result */
.result-bg{position:absolute;inset:0;background:rgba(4,7,18,.85);z-index:var(--z-result);display:none;align-items:center;justify-content:center;padding:18px}
.result-bg.show{display:flex}
.result{width:100%;max-width:420px;background:var(--panel);border:1.5px solid var(--panel-edge);border-radius:22px;
  padding:26px 22px;text-align:center;animation:up .4s cubic-bezier(.2,.8,.3,1);max-height:88%;overflow-y:auto}
.stamp{display:inline-block;font-family:var(--mincho);font-weight:800;letter-spacing:.12em;
  padding:10px 26px;border-radius:8px;transform:rotate(-4deg);font-size:22px;margin-bottom:8px;animation:stampIn .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes stampIn{from{transform:rotate(-4deg) scale(2.4);opacity:0}}
.stamp.win{color:var(--heal);border:3px solid var(--heal);box-shadow:0 0 30px rgba(63,214,163,.3)}
.stamp.lose{color:var(--hurt);border:3px solid var(--hurt)}
.result .r-detail{font-size:12.5px;color:var(--ink-dim);line-height:1.9;margin:8px 0 14px}
.result .r-detail .stars{color:var(--gold);font-size:16px;letter-spacing:.15em}
.learn{background:rgba(108,184,238,.08);border:1px solid rgba(108,184,238,.25);border-radius:14px;padding:14px;font-size:12px;line-height:1.9;text-align:left;color:var(--ink-dim);margin-bottom:14px}
.learn h4{color:var(--sky);font-size:12.5px;margin-bottom:5px}
.reward{margin:4px 0 14px;perspective:600px}
.reward .rw-label{font-size:12px;color:var(--gold);font-weight:800;margin-bottom:10px;letter-spacing:.1em}
.rw-row{display:flex;gap:12px;justify-content:center}
.rw-row .card{margin:0;pointer-events:auto;cursor:pointer;box-shadow:0 3px 0 #c9bfa4,0 6px 14px rgba(0,0,0,.35)}
.rw-row .card:active{transform:scale(.96)}
.rw-row .card.picked{border-color:var(--gold);box-shadow:0 0 26px rgba(245,196,81,.6),0 3px 0 #b8912c}
.rw-row .card.notpicked{opacity:.3;pointer-events:none}
.goal-strip{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.gs-item{font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:99px;background:var(--night2);border:1px solid var(--panel-edge);color:var(--ink-dim);letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:5px}
.gs-item .icon{width:12px;height:12px}
.gs-item.ok{color:var(--heal);border-color:#1c5c46;background:rgba(15,52,40,.6)}
.gs-item.warn{color:var(--hurt);border-color:#6b2a1c}
.stance-opt{width:100%;text-align:left;background:rgba(255,255,255,.04);border:1.5px solid var(--panel-edge);border-radius:14px;padding:14px 15px;color:var(--ink);transition:all .15s}
.stance-opt:active{transform:scale(.98);border-color:var(--gold)}
.stance-opt .s-name{font-weight:800;font-size:14.5px}
.stance-opt .s-desc{font-size:11px;color:var(--ink-dim);margin-top:3px;line-height:1.6}
.stance-opt .s-fx{font-size:11px;color:var(--heal);margin-top:3px;font-weight:800}
@keyframes flipIn{0%{transform:rotateY(180deg) scale(.4);opacity:0}60%{transform:rotateY(0) scale(1.15)}100%{transform:none}}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.result-actions .btn{padding:12px 22px;font-size:14px}

/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(4,7,18,.78);z-index:var(--z-list);display:none;align-items:center;justify-content:center;padding:18px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1.5px solid var(--panel-edge);border-radius:20px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:11px;max-height:86%;overflow-y:auto}
.modal h3{font-size:16px;text-align:center;font-family:var(--mincho);letter-spacing:.1em}
.modal .btn{width:100%;padding:12px;font-size:14px}
.rule-body{font-size:12.5px;line-height:2;color:var(--ink-dim)}
.rule-body b{color:var(--gold)}
.coll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.coll-grid .card{min-height:108px;pointer-events:auto;cursor:pointer;touch-action:auto}
.coll-grid .card.locked-card{filter:grayscale(1) brightness(.5);pointer-events:none}
.coll-grid .card.locked-card .c-icon{filter:blur(2px)}
.coll-grid .card.excluded-card{filter:grayscale(.85) brightness(.55);cursor:pointer}
.coll-grid .card.excluded-card::after{content:'外している（タップで戻す）';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:10px;font-weight:800;color:#fff;background:rgba(4,7,18,.55);padding:6px;border-radius:6px;pointer-events:none}
.coll-grid .card.picked{border-color:var(--gold);box-shadow:0 0 20px rgba(245,196,81,.55),0 3px 0 #b8912c}
.deck-sec{font-size:11.5px;color:var(--gold);font-weight:800;margin:12px 0 7px;text-align:left}
.coll-grid .card.base-card{opacity:.82}
.coll-grid .card .dup-badge{position:absolute;top:-7px;right:-4px;background:var(--sky);color:#04202e;
  font-size:9.5px;font-weight:900;padding:1px 6px;border-radius:99px}
.reveal-icon{font-size:44px;text-align:center;line-height:1;margin:2px 0 6px;
  animation:revealPop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes revealPop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.reveal-title{text-align:center;color:var(--gold);margin:0 0 8px}
.pulse{position:relative;animation:btnPulse 1.6s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,196,81,.55)}50%{box-shadow:0 0 0 7px rgba(245,196,81,0)}}
.skill-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.skill-row{background:var(--night2);border:1px solid var(--panel-edge);border-radius:12px;padding:10px 12px}
.skill-row.owned{opacity:.7}
.skill-row.gated{opacity:.4}
.skill-row.gated .sk-cost{color:var(--ink-dim)}
.skill-row .sk-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.skill-row .sk-cost{color:var(--gold);font-size:11.5px;font-weight:700}
.skill-row .sk-desc{font-size:11.5px;color:var(--ink-dim);line-height:1.6;margin-top:4px}
.skill-row .sk-buy{margin-top:8px;width:100%}
.coll-count{font-size:11px;color:var(--ink-dim);text-align:center}

/* ending */
#scr-ending{align-items:center;justify-content:center;gap:18px;text-align:center}
#scr-ending .end-earth{width:min(80vw,320px)}
.end-title{font-family:var(--mincho);font-size:22px;letter-spacing:.2em}
.end-sub{font-size:12px;color:var(--ink-dim);line-height:2}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){
  .card{min-height:112px}.card .c-icon{font-size:23px}
  .hand{min-height:114px}
}
</style>
</head>

"use strict";
/* =====================================================================
   ちいさな地球の治しかた — アーキテクチャ概要
   ---------------------------------------------------------------------
   単一HTMLファイル。ビルド不要、そのまま配布・実行できることを優先し、
   意図的に分割していない。編集時は以下を踏まえること。

   ■ 主要データ構造
     TAGS       カードのタグ5種(政策/技術/市民/自然/経済)と表示ラベル
     DOMAINS    プラネタリー・バウンダリー9領域(地球上のマーカー)
     CARDS      全カード定義(通常/報酬/教訓/チェイン/進化バリアント)
                cardById() は totalCleared() に応じて進化バリアントを
                自動解決するので、直接 CARDS.find() しないこと
     MISSIONS   前編/後編18ミッション。TUNE で難易度を上書きする箇所あり
     S          セーブされる状態(stance/cleared/owned/skills/flags…)
     R          1ミッション中だけ生きる一時状態(env/life/hand/turn…)

   ■ オーバーレイ(モーダル/シート)
     z-index は :root の --z-* 変数で一元管理(CSS冒頭のコメント参照)。
     開閉は必ず openOverlay(id) / closeOverlay(id) / closeAllOverlays() を
     使うこと。直接 classList を触らない。
     過去の不具合：
       - 同じ .sheet-bg クラスを3要素(#sheet-bg/#dom-bg/#brief-bg)で
         使い回していたため、z-indexの前提が食い違って一覧モーダルの
         裏にカード詳細が隠れるバグがあった → 個別のIDで明示的に指定。
       - ミッション開始時に前の画面のオーバーレイが閉じ切っておらず、
         残像のように重なって見えるバグがあった → startMission() 冒頭で
         closeAllOverlays() を呼び安全網にしている。

   ■ 機能解放(リビール)システム
     showReveal(key, onClose) / advanceRevealChain() で、初回プレイ時に
     デッキ編集→スキル→合成→チェインカードの順で1つずつ提示する。
     「次のリビールを見せる」判断は特定のボタンの押され方に依存させず、
     advanceRevealChain() を各画面の閉じる操作から共通で呼ぶこと
     (依存させると、途中で別の画面に寄り道された時に連鎖が止まる)。

   ■ 地球(ホーム画面の球体)の実装

     「縦軸まわりの自転」を表現している(tilewの分だけ動かしてループ)。
     円形へのクリップは SVGの clip-path や foreignObject を使わず、
     普通のHTML <div style="border-radius:50%;overflow:hidden"> を
     絶対配置する方式にしている。理由：
       - filter と clip-path の組み合わせはブラウザ・GPU合成の状態
         (通常モード/シークレットモード等)によって挙動が割れることが
         実際に確認された。
       - foreignObject 経由のHTML埋め込みは、Safariでのスケーリング
         挙動に既知の問題があり、実機で崩れることが確認された。
     border-radius + overflow:hidden は最も枯れた実装のため、今後も
     この方式を維持し、SVG側のクリップに戻さないこと。

   ■ カードの見た目
     .card は角丸を小さくした「物理カード」風デザイン。バッジ類
     (コンボ!／✨進化)はカード外周からわずかにはみ出す絶対配置なので、
     .card 自体には overflow:hidden を付けないこと(付けるとバッジが
     切れて見えなくなる、過去に実際に起きた不具合)。クリップが必要な
     のはアートエリア(.c-art)側だけ。

   ■ 検証
     window.STE に主要関数を公開しているのはテスト用フック。
     test.js〜test11.js（別ファイル）で日本語UIの状態遷移を検証して
     いるので、構造を変える時はこれらを実行して回帰がないか確認する。

  desc:'化石燃料に頼らない電気へ。最初の投資は重いが、負荷はずっと減り続ける。',
  fact:'太陽光発電のコストはこの10年ほどで大きく下がり、多くの地域で最も安い電源のひとつになりました。'},
 {id:'c04',icon:'🏛️',name:'環境ルールの強化',tag:'policy',combo:['citizen'],fx:{load:4,dur:3,life:-6},
  desc:'排出や乱獲に厳しいルールを。効果は大きいが、くらしへの負担も大きい劇薬。',
  fact:'日本の公害対策は四大公害を実際に改善させました。鍵は「くらしとの両立」でした。'},
 {id:'c05',icon:'📚',name:'学びの種まき',tag:'citizen',combo:[],fx:{care:1,dur:0,life:1},
  desc:'学校や地域で環境を学ぶ。すぐには効かないが、未来の行動を静かに変えていく。',
  fact:'環境教育は費用対効果が高い施策。持続可能性を学ぶ教育は各国の学びに広がっています。'},
 {id:'c06',icon:'♻️',name:'リサイクルの輪',tag:'tech',combo:['citizen'],fx:{env:3,load:2,dur:3,life:2},
  desc:'ごみが資源に変わる仕組みをつくる。新しい仕事も生まれる。',
  fact:'再生素材の活用は、新品づくりよりCO2やエネルギーを減らせる場合が多くあります。'},
 {id:'c07',icon:'🐟',name:'獲りすぎない漁',tag:'nature',combo:['policy','econ'],fx:{care:2,dur:0},
  desc:'海の回復力を超えない獲り方に変える。未来もずっと魚が食べられる海に。',
  fact:'世界の水産資源のかなりの割合が獲りすぎの状態。漁獲規制や認証には資源回復の実績があります。'},
 {id:'c08',icon:'💼',name:'グリーン投資',tag:'econ',combo:['tech'],fx:{life:6,care:1,dur:0},
  desc:'環境に良い事業へお金を流す。経済を回しながら保全の力を底上げする。',
  fact:'環境や社会に配慮した投資は世界で拡大。「環境か経済か」ではなく「両立」が主流になりつつあります。'},
 {id:'c09',icon:'🧹',name:'まちと浜の大そうじ',tag:'citizen',combo:['nature'],fx:{env:6},
  desc:'みんなで拾えば、目に見えて景色が変わる。参加した人の心も変わる。',
  fact:'海岸清掃には毎年世界で多くの人が参加。集めたごみのデータは発生源対策にも使われます。'},
 {id:'c10',icon:'🌱',name:'木を植える',tag:'nature',combo:['citizen'],fx:{env:3,care:2,dur:3},
  desc:'切られた土地に木を戻す。育つまで時間はかかるが、効きめは長い。',
  fact:'木は成長期にCO2をよく吸います。ただし土地に合う木を選び、育て続けることが大切です。'},
 {id:'c11',icon:'🚲',name:'歩く・こぐ・乗り合う',tag:'citizen',combo:['tech'],fx:{load:1,dur:0,life:1},
  desc:'自転車・電車・徒歩をえらぶ。渋滞が減り、まちの空気も澄んでいく。',
  fact:'クルマから電車やバスへの乗り換えは、移動あたりのCO2を大きく減らせます。'},
 {id:'c12',icon:'🛰️',name:'環境を見張る目',tag:'tech',combo:['policy'],fx:{env:2,care:2,dur:2},
  desc:'衛星とセンサーで異変を早く見つける。早く気づけば、早く手が打てる。',
  fact:'温室効果ガスや森林を宇宙から監視する衛星が活躍。観測データは世界の対策の土台です。'},
 {id:'c13',icon:'🤝',name:'世界と手を組む',tag:'policy',combo:['econ'],fx:{care:2,dur:0,life:2},
  desc:'環境問題に国境はない。約束を交わし、いっしょに動く。',
  fact:'オゾン層を守るモントリオール議定書は「成功した国際協力」の代表例とされています。'},
 {id:'c14',icon:'🏭',name:'工場のクリーン化支援',tag:'econ',combo:['policy'],fx:{load:2,dur:0,life:3},
  desc:'罰ではなく後押しで、企業の転換を加速させる。',
  fact:'補助や税の優遇は規制と組み合わせると効果的。省エネ技術の普及を後押しします。'},
 {id:'c15',icon:'🦆',name:'湿地と干潟の再生',tag:'nature',combo:['tech'],fx:{env:5,care:2,dur:2,life:-2},
  desc:'失われた水辺をよみがえらせ、自然自身の「治る力」を取り戻す。',
  fact:'回復した生態系は、水の浄化・洪水対策・漁業資源として人にも恵みを返します(生態系サービス)。'},
 {id:'c16',icon:'🛒',name:'えらぶ買い物',tag:'citizen',combo:['econ'],fx:{load:1,care:1,dur:0},
  desc:'環境にやさしい商品をえらぶ。買い物は、未来への投票。',
  fact:'認証マークは「えらぶ」ための手がかり。消費者の選択が企業のふるまいを動かします。'},
 {id:'c17',icon:'🚿',name:'水をたいせつに使う',tag:'citizen',combo:['tech'],fx:{env:2,load:1,dur:0},
  desc:'こまめに止める、ためて使う。蛇口の向こうの川と地下水を守る。',
  fact:'水をつくり届けるのにも多くのエネルギーが使われています。節水はエネルギー節約でもあります。'},
 {id:'c18',icon:'🏞️',name:'川の浄化プラント',tag:'tech',combo:['policy'],fx:{env:4,load:2,dur:2,life:-1},
  desc:'汚れた水をきれいにして川へ返す。飲み水の源をまもる要塞。',
  fact:'世界では多くの人が安全に管理された飲み水を使えません。浄水・下水インフラは基盤です。'},
 {id:'c19',icon:'🐠',name:'海の森(ブルーカーボン)',tag:'nature',combo:['tech'],fx:{env:4,care:2,dur:2},
  desc:'アマモやコンブの森を育てる。海の生きもののゆりかごが、CO2も吸ってくれる。',
  fact:'海草・海藻や干潟がたくわえる炭素は「ブルーカーボン」。各地で藻場再生が進んでいます。'},
 {id:'c20',icon:'🌾',name:'ちょうどよい施肥',tag:'nature',combo:['policy','tech'],fx:{care:2,load:1,dur:2},
  desc:'畑にまく肥料を、多すぎず少なすぎず。余った栄養が川へ流れるのを止める。',
  fact:'まきすぎた窒素・リンは川や湖へ流れ、藻の大発生(富栄養化)を招きます。適正施肥はその入口を絞ります。'},
 {id:'c21',icon:'🌀',name:'生ごみを堆肥とガスに',tag:'tech',combo:['econ'],fx:{env:3,load:1,dur:2,life:2},
  desc:'食べ残しや家畜のふんを、肥料とエネルギーに変える。捨てるものが、めぐりだす。',
  fact:'有機物の発酵で得るバイオガスはエネルギーに、残りは肥料に。栄養とCO2を同時に循環させます。'},
 {id:'c22',icon:'❄️',name:'フロンの回収・破壊',tag:'tech',combo:['policy'],fx:{env:4,load:2,dur:2},
  desc:'冷蔵庫やエアコンに眠る古いガスを、大気へ逃がさず確実に処理する。',
  fact:'一部のフロン類はオゾン層を壊し、強力な温室効果も持ちます。確実な回収・破壊が二重の対策になります。'},
 {id:'c23',icon:'🌳',name:'涼しいまちづくり',tag:'citizen',combo:['tech'],fx:{env:3,life:3,dur:2},
  desc:'木陰と風の道、白い屋根。まちそのものの暑さをやわらげる。',
  fact:'緑陰や反射性の高い屋根は、都市のヒートアイランドをやわらげ、冷房のエネルギーも減らします。'},
 {id:'c24',icon:'🪸',name:'サンゴの保全・移植',tag:'nature',combo:['citizen'],fx:{env:4,care:1,dur:2},
  desc:'弱ったサンゴを守り、丈夫な株を育てて移す。海の熱帯雨林を、絶やさない。',
  fact:'サンゴ礁は海の生きものの多くを支える「海の熱帯雨林」。高水温と酸性化が白化の大きな要因です。'},
 {id:'c25',icon:'🌿',name:'畑を覆う作物',tag:'nature',combo:['citizen'],fx:{care:2,env:2,dur:2},
  desc:'収穫の合間も土を裸にしない。土と栄養が流れ出るのを、根がつかまえる。',
  fact:'被覆作物(カバークロップ)は土の流出と栄養の流れ出しを抑え、土そのものを育てます。'},
 {id:'c26',icon:'🏠',name:'断熱リフォーム',tag:'tech',combo:['citizen'],fx:{load:3,dur:0,life:-2},
  desc:'すぐには楽にならない。でも壁の中の綿が、来年もその先も光熱費と負荷を減らし続ける。',
  fact:'住まいの断熱は冷暖房のエネルギーを大きく減らします。効果は長く続く「一度きりの投資」です。'},
 {id:'c27',icon:'🦢',name:'水辺の緩衝帯',tag:'nature',combo:['policy'],fx:{care:2,env:3,dur:2},
  desc:'川べりに草木の帯を残す。畑から流れる栄養や泥を、水に入る前に受け止める。',
  fact:'河畔の緩衝帯は栄養塩や土砂をこしとり、生きもののすみかにもなります。安価で効果的な自然の防波堤です。'},
 {id:'c28',icon:'🔧',name:'メタン漏れを止める',tag:'tech',combo:['policy'],fx:{load:3,dur:0},
  desc:'配管や埋立地からこっそり漏れる強力な温室効果ガスを、見つけて塞ぐ。',
  fact:'メタンは短期間の温室効果がCO2より強い一方、漏れを止める対策は比較的すぐ効果が出ます。'},
 /* ---- 報酬カード ---- */
 {id:'r01',icon:'🔁',name:'ごみゼロデザイン',tag:'tech',combo:['econ','citizen'],fx:{load:2,care:1,dur:0,life:1},reward:true,
  desc:'そもそもごみが出ない製品づくり。捨てる前提を、疑う。',
  fact:'循環型のものづくりでは「廃棄物は設計の失敗」と考えます。使い終わりを最初から設計に織り込みます。'},
 {id:'r02',icon:'🌧️',name:'雨水と再生水',tag:'tech',combo:['citizen'],fx:{env:3,care:2,dur:0},reward:true,
  desc:'雨をため、使った水をもう一度使う。水は「使い捨て」ではなくなった。',
  fact:'再生水や雨水利用は乾燥地域を中心に普及。水を何度もめぐらせて使う発想です。'},
 {id:'r03',icon:'🌲',name:'森と生きる会社',tag:'econ',combo:['nature'],fx:{care:2,dur:0,life:4},reward:true,
  desc:'森を壊さず森で稼ぐ。保全と経済が、はじめて同じ方向を向いた。',
  fact:'森を守る調達(認証材など)は企業評価に直結する時代。保全と収益を両立させる試みが増えています。'},
 {id:'r04',icon:'🔌',name:'かしこい電力網',tag:'tech',combo:['econ'],fx:{load:3,dur:0,life:3},reward:true,
  desc:'つくる・ためる・融通する。電気の流れが賢くなり、無駄が消えていく。',
  fact:'スマートグリッドと蓄電池は、天候で変わる再エネの弱点を補う鍵。蓄電コストも大きく下がりました。'},
 {id:'r05',icon:'🐝',name:'花の回廊',tag:'nature',combo:['citizen'],fx:{env:3,care:2,dur:0},reward:true,
  desc:'まちの隙間を花でつなぐ。小さな羽音が、実りを運んでくる。',
  fact:'花壇や緑地の連なりは、花粉を運ぶ昆虫の「道」になります。私たちの食べ物の多くが彼らに支えられています。'},
 {id:'r06',icon:'🚆',name:'まちの動脈(公共交通)',tag:'econ',combo:['citizen'],fx:{load:2,dur:0,life:2},reward:true,
  desc:'誰もが乗れる速くて安い足。クルマに頼らない、まちの背骨。',
  fact:'公共交通の充実したまちは、一人あたりのCO2排出が少ない傾向があります。'},
 {id:'r07',icon:'🛠️',name:'修理する権利',tag:'policy',combo:['tech'],fx:{load:2,care:1,dur:0,life:2},reward:true,
  desc:'直して使い続けられることを、権利として保障する。「買い替えろ」への反撃。',
  fact:'欧州などで「修理する権利」の法制化が進行。製品の寿命を延ばすことは最良のごみ対策のひとつです。'},
 {id:'r08',icon:'🏦',name:'自然資本バンク',tag:'econ',combo:['policy'],fx:{care:2,dur:0,life:3},reward:true,
  desc:'森も水も土も「資本」として帳簿に載せる。守ることが、儲かることに。',
  fact:'自然を経営や会計に組み込む枠組みが世界で広がり、保全を「コスト」から「価値」へと変えつつあります。'},
 {id:'r09',icon:'🛩️',name:'精密農業',tag:'tech',combo:['econ'],fx:{care:2,load:1,dur:0},reward:true,
  desc:'必要な場所に、必要なだけ。センサーとデータで肥料と水の無駄をなくす。',
  fact:'土壌や作物のデータに基づく施肥は、栄養の流出とコストを同時に減らせます。'},
 {id:'r10',icon:'🌍',name:'国際フロン基金',tag:'policy',combo:['econ'],fx:{load:2,care:1,dur:0,life:2},reward:true,
  desc:'豊かな国が資金を出し、どの国もフロンを止められるように支える。',
  fact:'オゾン層保護では、途上国の転換を支える国際的な資金の仕組みが成功の鍵になりました。'},
 {id:'r11',icon:'🌊',name:'海藻養殖ビジネス',tag:'econ',combo:['nature'],fx:{env:3,care:1,dur:0,life:2},reward:true,
  desc:'海藻を育てて売る。海の森を増やしながら、浜に仕事をつくる。',
  fact:'海藻の養殖は食料・飼料・素材になり、育つ過程でCO2や栄養塩を吸収します。'},
 {id:'r12',icon:'🦌',name:'生きものの回廊',tag:'nature',combo:['policy'],fx:{care:3,dur:0},reward:true,
  desc:'分断された森と森を、緑の橋でつなぎ直す。生きものが、また行き来できる。',
  fact:'生態回廊(コリドー)は分断された生息地をつなぎ、種の行き来と遺伝的な健康を保ちます。'},
 {id:'r13',icon:'⚓',name:'ゼロエミ港湾',tag:'tech',combo:['econ'],fx:{load:2,env:2,dur:0},reward:true,
  desc:'船も荷役も電気で動く港。海のそばの空気と水を、汚さない玄関口に。',
  fact:'港の電動化や陸上電源は、沿岸の大気汚染とCO2をまとめて減らします。'},
 {id:'r14',icon:'🌧️',name:'雨庭と浸透のまち',tag:'nature',combo:['citizen'],fx:{env:3,care:2,dur:0},reward:true,
  desc:'雨をコンクリートで流さず、土と植物にしみ込ませる。まちが、スポンジになる。',
  fact:'雨庭や透水性舗装などのグリーンインフラは、洪水をやわらげ地下水を養い、水をきれいにします。'},

  desc:'植えた木々は根を張り、まちの人たちの手で守られる森へと育っている。',

  desc:'クリーン化の支援を受けた工場が、今度は自ら脱炭素をリードする側になった。',

 {id:'c02_t2',icon:'🌴',name:'森の聖域',tag:'nature',combo:['policy'],fx:{care:4,dur:0,life:-2},variant:true,evolveFrom:'c02',

function tierCardId(baseId){
  const chain=EVOLUTIONS[baseId];if(!chain)return baseId;
  const n=(typeof totalCleared==='function')?totalCleared():0;
  let cur=baseId;
  for(const step of chain){if(n>=step.at)cur=step.id;}
  return cur;
}
const cardById=id=>{
  const tid=tierCardId(id);
  return CARDS.find(c=>c.id===tid)||CARDS.find(c=>c.id===id);
};

 people:'　あなたは、ひとりひとりの手と、まちでの約束を、なにより信じました。人と人とが結び直す力を、私たちは今も暮らしのなかで感じています。',

 balanced:'　あなたは、ひとつのやり方に頼りませんでした。いろんな手を、いろんな場所で。それが、この星のしなやかさになりました。'
};
const STYLE_NAME={people:'人とつながる力',nature:'自然に寄り添う力',techecon:'知恵と仕組みの力',balanced:'しなやかな歩み'};
function dominantStyle(){
  const t=S.tagTally||{};
  const people=(t.citizen||0)+(t.policy||0);
  const nature=(t.nature||0);
  const techecon=(t.tech||0)+(t.econ||0);
  const vals=[['people',people],['nature',nature],['techecon',techecon]].sort((a,b)=>b[1]-a[1]);
  if(vals[0][1]===0)return 'balanced';
  if((vals[0][1]-vals[1][1])/vals[0][1]<0.15)return 'balanced';
  return vals[0][0];
}
function getFinalLetter(){
  const style=dominantStyle();
  const lines=LETTER_FINAL.lines.slice();
  let insertAt=3;
  if(S.flags.hiroIntro){
    lines.splice(insertAt,0,{t:'　あなたが「ヒロ」と呼んで、迷うたびに相談していた声——あれも、私です。'});
    insertAt++;
  }
  lines.splice(insertAt+5,0,{t:STYLE_LINE[style]});
  return {lines,sign:S.flags.hiroIntro?'　　　　　　百年あとの、あなたの隣人——ヒロより':LETTER_FINAL.sign,style};
}

const store=(()=>{
  let mem={};
  function ok(){try{return typeof window!=='undefined'&&window.localStorage;}catch(e){return null;}}
  return {
    get(k){try{if(ok())return localStorage.getItem(k);}catch(e){} return (k in mem)?mem[k]:null;},
    set(k,v){try{if(ok()){localStorage.setItem(k,v);return;}}catch(e){} mem[k]=v;},
    del(k){try{if(ok()){localStorage.removeItem(k);return;}}catch(e){} delete mem[k];},
  };
})();

const isCleared=id=>S.cleared.includes(id);
function reqMet(m){
  const r=m.requires||{};
  if(r.all&&!r.all.every(isCleared))return false;
  if(r.any&&!r.any.some(isCleared))return false;
  if(r.count&&r.count.of.filter(isCleared).length<r.count.n)return false;
  return true;
}
function missionState(m){if(isCleared(m.id))return 'done';return reqMet(m)?'avail':'locked';}
function domainMissionsCleared(dom){return domainMissions(dom).filter(m=>isCleared(m.id)).length;}
function domainState(dom){
  const ms=domainMissions(dom);const done=domainMissionsCleared(dom);
  if(done===ms.length)return 'done';
  if(ms.some(m=>missionState(m)==='avail'))return 'avail';
  if(done>0)return 'part';
  return 'locked';
}
const domainHealFrac=dom=>domainMissionsCleared(dom)/domainMissions(dom).length;

/* ミッション評価：目標に対する余裕(env / くらし)の小さい方で判定 */
function missionStars(runState){
  if(!runState||!runState.m)return 1;
  const envMargin=runState.env-runState.m.envTarget;
  const lifeMargin=runState.m.lifeTarget!=null?(runState.life-runState.m.lifeTarget):null;
  const margin=lifeMargin!=null?Math.min(envMargin,lifeMargin):envMargin;
  if(margin>=25)return 3;
  if(margin>=10)return 2;
  return 1;
}

/* 新たに解放されるミッション（clear前後の差分） */
function newlyUnlocked(beforeCleared,afterCleared){
  const wasAvail=id=>{const m=missionById(id);if(!m)return true;const r=m.requires||{};
    if(beforeCleared.includes(id))return true;
    if(r.all&&!r.all.every(x=>beforeCleared.includes(x)))return false;
    if(r.any&&!r.any.some(x=>beforeCleared.includes(x)))return false;
    if(r.count&&r.count.of.filter(x=>beforeCleared.includes(x)).length<r.count.n)return false;
    return true;};
  const nowAvail=id=>{const m=missionById(id);if(!m)return true;const r=m.requires||{};
    if(afterCleared.includes(id))return true;
    if(r.all&&!r.all.every(x=>afterCleared.includes(x)))return false;
    if(r.any&&!r.any.some(x=>afterCleared.includes(x)))return false;
    if(r.count&&r.count.of.filter(x=>afterCleared.includes(x)).length<r.count.n)return false;
    return true;};
  return MISSIONS.filter(m=>!beforeCleared.includes(m.id)&&!wasAvail(m.id)&&nowAvail(m.id)).map(m=>m.id);
}

   直接 classList.add('show') / remove('show') を書かず、必ずここを通すこと。
   理由：過去に「閉じ忘れて裏に別のモーダルが残る」「z-indexが噛み合わない」
   といった不具合が繰り返し起きたため。新しいオーバーレイを増やす場合も
   このヘルパー経由にし、IDは OVERLAY_IDS に追記する。 */
const OVERLAY_IDS=['sheet-bg','dom-bg','brief-bg','dilemma-bg','event-bg','result-bg','letter-bg','modal-bg'];

/* 画面遷移など「とにかく全部閉じておきたい」時に使う安全網。個別のexceptは除外できる。 */

}
/* ---------- 背景の星空(canvas。写真は使わずprocedural生成) ---------- */
function sizeBgCanvas(){
  const c=$('bg-canvas');if(!c)return;
  const dpr=window.devicePixelRatio||1;
  const w=window.innerWidth,h=window.innerHeight;
  c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
  const ctx=c.getContext&&c.getContext('2d');if(!ctx)return;
  ctx.scale(dpr,dpr);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#141b2c');g.addColorStop(.55,'#0e1526');g.addColorStop(1,'#0a0f1c');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  function blob(x,y,r,c1,c2){
    const rg=ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,c1);rg.addColorStop(1,c2);
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  ctx.globalAlpha=.5;
  blob(w*.22,h*.15,w*.55,'rgba(120,90,190,.32)','rgba(120,90,190,0)');
  blob(w*.82,h*.35,w*.5,'rgba(60,150,160,.24)','rgba(60,150,160,0)');
  blob(w*.5,h*.85,w*.6,'rgba(90,60,120,.2)','rgba(90,60,120,0)');
  ctx.globalAlpha=1;
  for(let i=0;i<Math.floor(w*h/4200);i++){
    const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.1+.2,a=Math.random()*.7+.15;
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  for(let i=0;i<Math.floor(w*h/28000);i++){
    const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.3+1;
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x-r*3,y);ctx.lineTo(x+r*3,y);ctx.moveTo(x,y-r*3);ctx.lineTo(x,y+r*3);ctx.stroke();
  }
}
const clampv=v=>Math.max(0,Math.min(100,Math.round(v)));
const FASTON=()=>(typeof window!=='undefined'&&window.__FAST);
const wait=ms=>new Promise(r=>setTimeout(r,FASTON()?Math.min(ms,8):ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function startMission(m){
  // 残留オーバーレイ(カード詳細シートなど)が開いたままにならないよう、開始時に必ず閉じる
  closeAllOverlays();
  R={m,env:m.envStart,life:m.lifeStart+(S.stance==='bond'?6:0)+(S.skills.breath?3:0),
     baseLoad:m.baseLoad,baseCare:m.baseCare,loadGrow:m.loadGrow||0,
     turn:1,maxTurns:m.turns,loadMods:[],careMods:[],playedTags:[],lastTag:null,tipped:false,
     tagBoost:null,tagBoostLeft:0,busy:false,over:false,
     drawPile:shuffle(m.deck.concat(S.owned.filter(id=>!S.deckExclude.includes(id)))),hand:[]};
  R.life=clampv(R.life);
  for(let i=0;i<handCap();i++)drawOne(true);
  $('hm-name').textContent=m.name;
  $('hm-axis').textContent=m.axis;
  $('board-svg').innerHTML=buildBoardSVG();
  $('board-bg-art').innerHTML=boardBgSVG(m.domain);
  renderGoals();renderPips();renderHand();updateBoard();setLog('カードを盤面へドラッグして、修復をはじめよう。');
  showScreen('scr-play');
}
function sumMods(a){return a.reduce((s,m)=>s+m.amt,0);}
function curLoad(t){t=t||R.turn;return Math.max(0,R.baseLoad+R.loadGrow*(t-1)-sumMods(R.loadMods)-(S.stance==='spark'?1:0));}
function curCare(){return R.baseCare+sumMods(R.careMods)+(S.stance==='guard'?1:0);}
function forecastNet(){return curCare()-curLoad();}

function drawOne(silent){
  if(R.drawPile.length===0)R.drawPile=shuffle(R.m.deck);
  const id=R.drawPile.shift();R.hand.push({id,uid:id+'_'+Math.random().toString(36).slice(2,7),fresh:!silent});
  if(R.hand.length>handCap())R.hand.shift();
}

function renderGoals(){

      <div class="c-fx">${fxShort(c.fx)}</div>
    </div>`;
}
function durTxt(d){return d===0?'ずっと':`${(d||1)}年`;}
function fxShort(fx){
  const p=[];
  if(fx.env)p.push(`<span class="fx-row ${fx.env>0?'good':'bad'}"><svg class="icon"><use href="#i-leaf"/></svg>環境${fx.env>0?'+':''}${fx.env}</span>`);
  if(fx.load)p.push(`<span class="fx-row good"><svg class="icon"><use href="#i-weight"/></svg>負荷${fx.load>0?'-':'+'}${Math.abs(fx.load)}<i class="fx-dur">${durTxt(fx.dur)}</i></span>`);
  if(fx.care)p.push(`<span class="fx-row good"><svg class="icon"><use href="#i-shield"/></svg>保全+${fx.care}<i class="fx-dur">${durTxt(fx.dur)}</i></span>`);
  if(fx.life)p.push(`<span class="fx-row ${fx.life>0?'good':'bad'}"><svg class="icon"><use href="#i-home"/></svg>くらし${fx.life>0?'+':''}${fx.life}</span>`);
  return p.join('');

function comboReady(c){return !!R.lastTag && (c.combo||[]).includes(R.lastTag);}

/* ---------- play a card ---------- */
/* ---------- ヒロ(相棒キャラ)のヒント ---------- */
function showHint(){
  if(!R||R.over||!R.hand.length)return;
  let best=R.hand[0],bestScore=-Infinity;
  R.hand.forEach(h=>{
    const c=cardById(h.id);
    const dur=c.fx.dur;
    const weight=dur===0?4:(dur||1);
    let s=(c.fx.env||0)+(c.fx.load||0)*1.3*weight+(c.fx.care||0)*1.3*weight;
    if(comboReady(c))s+=3;
    if(s>bestScore){bestScore=s;best=h;}
  });
  const c=cardById(best.id);
  let msg;
  if(comboReady(c))msg=`💬 ヒロ「さっきの流れなら、${c.name}がよく効きそう。」`;
  else if(c.fx.dur===0)msg=`💬 ヒロ「${c.name}は、ずっと効く。土台づくりに良さそうだよ。」`;
  else if((c.fx.env||0)>=4)msg=`💬 ヒロ「今は${c.name}で、一気に押し出すのも手かもね。」`;
  else msg=`💬 ヒロ「${c.name}が、今のところ一番手堅いと思う。」`;
  if(!S.flags.hiroIntro){S.flags.hiroIntro=true;save();msg=`💬 ヒロ「はじめまして。困ったら、いつでも声かけて。」<br>`+msg;}
  setLog(msg,true);
}

async function playCardByUid(uid,dropX,dropY){
  if(R.busy||R.over)return;
  const idx=R.hand.findIndex(c=>c.uid===uid);if(idx<0)return;
  const preCard=R.hand[idx];const preC=cardById(preCard.id);
  if(chapter2Active()&&isPermanentCard(preC)&&permanentSlotItems(preC.tag).length>=slotCap()){
    R.busy=true;
    const picked=await chooseSlotSwap(preC.tag,preC.name);
    const arrIdx=picked.arr.indexOf(picked.mod);if(arrIdx>=0)picked.arr.splice(arrIdx,1);
    updateBoard();
    R.busy=false;
  }
  if(R.busy||R.over)return;
  R.busy=true;$('hand').classList.add('wait');
  const card=R.hand[idx];const c=cardById(card.id);
  R.hand.splice(idx,1);
  // combo
  const combo=comboReady(c);
  await applyFx(c.fx,c.name,dropX,dropY,c.tag);
  if(combo){R.env=clampv(R.env+3);popAt('🌍+3 コンボ!','#f0cf87',dropX,dropY-30);setLog(`<span class="combo">コンボ成立！</span> ${c.name} が連鎖した。`,true);
    const bEl=$('board');bEl.classList.add('combo-flash');setTimeout(()=>bEl.classList.remove('combo-flash'),650);}
  else setLog(`<b>${c.name}</b> を実行した。`);
  R.playedTags.push(c.tag);
  R.lastTag=c.tag;
  S.tagTally[c.tag]=(S.tagTally[c.tag]||0)+1;
  if(R.tagBoost&&c.tag===R.tagBoost&&R.tagBoostLeft>0){R.env=clampv(R.env+2);R.tagBoostLeft--;popAt('🌍+2','#a88be8',dropX+20,dropY);}
  updateBoard();
  await wait(360);
  if(c.chain){
    setLog('<span class="combo">🔗 年を消費せず、続けてもう1枚出せる。</span>',true);
    if(R.drawPile.length===0)R.drawPile=shuffle(R.m.deck);
    drawOne(false);renderHand();updateBoard();
    R.busy=false;$('hand').classList.remove('wait');
    return;
  }
  await advanceYear();
  R.busy=false;$('hand').classList.remove('wait');
}

async function applyFx(fx,label,x,y,tag){
  if(!fx)return;
  if(typeof fx.env==='number'){R.env=clampv(R.env+fx.env);popAt(`🌍${fx.env>0?'+':''}${fx.env}`,fx.env>0?'#6cb8ee':'#ef9274',x,y);await wait(120);}
  if(typeof fx.life==='number'){R.life=clampv(R.life+fx.life);popAt(`🏘️${fx.life>0?'+':''}${fx.life}`,fx.life>0?'#f0cf87':'#ef9274',(x||170)+30,y);await wait(120);}
  if(typeof fx.load==='number'){R.loadMods.push({amt:fx.load,left:fx.dur===0?Infinity:(fx.dur||1),tag:tag||null,name:label||null});}
  if(typeof fx.care==='number'){R.careMods.push({amt:fx.care,left:fx.dur===0?Infinity:(fx.dur||1),tag:tag||null,name:label||null});}
  if(fx.boostTag){R.tagBoost=fx.boostTag;R.tagBoostLeft=2;}
  updateBoard();
}

function permanentSlotItems(tag){

async function advanceYear(){
  // yearly environment change
  const net=forecastNet();
  R.env=clampv(R.env+net);
  if(net!==0){popAt(`🌍${net>0?'+':''}${net}`,net>0?'#7ee0ab':'#ef9274',150,110);flashEnv();}
  // decay durational mods
  R.loadMods.forEach(m=>m.left--);R.loadMods=R.loadMods.filter(m=>m.left>0);
  R.careMods.forEach(m=>m.left--);R.careMods=R.careMods.filter(m=>m.left>0);
  updateBoard();
  await wait(220);
  // ティッピングポイント(不可逆な転換点)
  const tipAt=R.m.tipPoint!=null?R.m.tipPoint:tipThreshold();
  if(chapter2Active()&&!R.tipped&&R.env<tipAt){
    R.tipped=true;
    setLog('<span class="combo">⚠️ ティッピングポイントを超えた……</span>',true);
    await showEventModal({icon:'⚠️',name:'ティッピングポイント',
      text:'傷みが、取り返しのつかない段階を越えてしまった。これ以降、毎年の負荷は元には戻らず重くなる。',
      fx:{load:-TIP_PENALTY,dur:0},
      fact:'生態系には「転換点(ティッピングポイント)」と呼ばれる閾値があります。一度超えると、回復にとても長い時間がかかったり、元の状態には戻れなくなったりすることがあります。'});
    updateBoard();
  }
  // dilemma?
  if(R.m.dilemma&&R.m.dilemma.turn===R.turn&&!R.dilemmaDone){R.dilemmaDone=true;await showDilemma(R.m.dilemma);}
  // events this turn
  const evs=(R.m.events||[]).filter(e=>e.turn===R.turn);
  for(const ev of evs){await showEventModal(ev);}
  // 澱の一手(対抗勢力AI)
  const bossMoves=(R.m.boss&&R.m.boss.moves||[]).filter(mv=>mv.turn===R.turn);
  for(const mv of bossMoves){
    setLog(`<span class="combo">🌑 ${R.m.boss.name}が動いた……</span>`,true);
    await showEventModal(mv);
  }
  // life bottom-out
  if(R.life<=0){return finishMission(false,'くらしが立ち行かなくなった……');}
  // next year
  R.turn++;
  renderPips();
  if(R.turn>R.maxTurns){
    const win=R.env>=R.m.envTarget&&(!R.m.lifeTarget||R.life>=R.m.lifeTarget);
    return finishMission(win, win?'':'期限までに目標へ届かなかった……');
  }
  drawOne(false);renderHand();updateBoard();
}

/* =====================================================
   UI OVERLAYS — drag / sheets / letter / result
===================================================== */
let drag=null;
function attachCardHandlers(node,card){
  let moved=false,sx=0,sy=0;
  const onDown=e=>{
    if(R.busy||R.over)return;
    const pt=e.touches?e.touches[0]:e;sx=pt.clientX;sy=pt.clientY;moved=false;
    drag={card,node,gx:pt.clientX,gy:pt.clientY};
    document.addEventListener('pointermove',onMove,{passive:false});
    document.addEventListener('pointerup',onUp);
    e.preventDefault();
  };
  const onMove=e=>{
    if(!drag)return;const pt=e;const dx=pt.clientX-sx,dy=pt.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)>10){moved=true;startGhost();node.classList.add('dragging-src');}
    if(moved){moveGhost(pt.clientX,pt.clientY);hotBoard(pt.clientX,pt.clientY);e.preventDefault();}
  };
  const onUp=e=>{
    document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);
    if(!drag)return;
    if(moved){
      const b=$('board').getBoundingClientRect();
      const over=e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom;
      $('board').classList.remove('drop-hot');node.classList.remove('dragging-src');
      const gx=e.clientX,gy=e.clientY;const bx=gx-b.left,by=gy-b.top;
      hideGhost();
      const d=drag;drag=null;
      if(over)playCardByUid(d.card.uid,bx,by);else renderHand();
    }else{drag=null;openCardSheet(card);}
  };
  node.addEventListener('pointerdown',onDown);
}
function startGhost(){const g=$('drag-ghost');g.innerHTML=`<div class="card">${cardInner(cardById(drag.card.id))}</div>`;g.style.display='block';}
function moveGhost(x,y){const g=$('drag-ghost');g.style.left=x+'px';g.style.top=y+'px';}
function hideGhost(){$('drag-ghost').style.display='none';}
function hotBoard(x,y){const b=$('board').getBoundingClientRect();const over=x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom;$('board').classList.toggle('drop-hot',over);}

function fxLong(fx){
  const rows=[];
  if(fx.env)rows.push(`<svg class="icon"><use href="#i-leaf"/></svg> 環境が <b class="${fx.env<0?'bad':''}">${fx.env>0?'+':''}${fx.env}</b>`);
  if(fx.life)rows.push(`<svg class="icon"><use href="#i-home"/></svg> くらしが <b class="${fx.life<0?'bad':''}">${fx.life>0?'+':''}${fx.life}</b>`);
  if(fx.load)rows.push(`<svg class="icon"><use href="#i-weight"/></svg> 毎年の負荷を <b class="${fx.load<0?'bad':''}">${fx.load>0?'-':'+'}${Math.abs(fx.load)}</b>${durText(fx)}`);
  if(fx.care)rows.push(`<svg class="icon"><use href="#i-shield"/></svg> 毎年の保全を <b>+${fx.care}</b>${durText(fx)}`);
  if(fx.boostTag)rows.push(`<svg class="icon"><use href="#i-star"/></svg> ${TAGS[fx.boostTag].label}カードに追い風`);
  return rows.join('<br>');

function durText(fx){if(fx.load==null&&fx.care==null)return '';if(fx.dur===0)return '（ずっと）';if(fx.dur)return `（${fx.dur}年）`;return '（1年）';}

/* ---------- letter (全行自動表示・閉じるボタン常時) ---------- */
function showLetter(data,onClose){
  const box=$('letter-lines');box.innerHTML='';
  const lines=data.lines.slice();
  lines.forEach(l=>{
    const div=elx('div','l-line'+(l.w?' whisper':''));div.textContent=l.t;box.appendChild(div);
  });
  if(data.sign){const s=elx('div','l-sign');s.textContent=data.sign;box.appendChild(s);}
  openOverlay('letter-bg');
  // reveal sequentially but close button is ALWAYS visible/enabled
  const nodes=[...box.querySelectorAll('.l-line, .l-sign')];
  let i=0;const step=()=>{if(i<nodes.length){nodes[i].classList.add('on');i++;setTimeout(step,FASTON()?4:340);}};
  setTimeout(step,FASTON()?2:120);
  $('btn-letter-close').onclick=()=>{
    // if not all shown yet, first click reveals all; but never blocks closing
    if(nodes.some(n=>!n.classList.contains('on'))){nodes.forEach(n=>n.classList.add('on'));}
    closeOverlay('letter-bg');$('btn-letter-close').onclick=null;if(onClose)onClose();
  };
}

/* ---------- result ---------- */
function finishMission(win,detail){
  R.over=true;R.busy=false;
  const wasCleared=isCleared(R.m.id);
  const before=S.cleared.slice();
  let unlocked=[];
  let starsEarned=0;
  let skillPtGained=false;
  let firstClear=false;
  if(win){
    starsEarned=missionStars(R);
    const prevStars=S.stars[R.m.id]||0;
    if(starsEarned>prevStars)S.stars[R.m.id]=starsEarned;
    starsEarned=Math.max(starsEarned,prevStars);
    if(!wasCleared){
      const domBefore=domainMissionsCleared(R.m.domain);
      S.cleared.push(R.m.id);
      unlocked=newlyUnlocked(before,S.cleared);
      const domAfter=domainMissionsCleared(R.m.domain);
      if(domBefore<2&&domAfter>=2){S.skillPts=(S.skillPts||0)+1;skillPtGained=true;}
      // はじめての修復では、その場でスキルポイントを1つ渡す（スキルツリーの解放）
      if(S.cleared.length===1&&!revealDone('skill')){S.skillPts=(S.skillPts||0)+1;firstClear=true;}
    }
  }
  save();
  // 失敗リカバリー：はじめて失敗したミッションごとに教訓カードを1枚
  let lessonCard=null;
  if(!win){
    if(!S.flags.lessonGiven)S.flags.lessonGiven={};
    if(!S.flags.lessonGiven[R.m.id]){
      const avail=LESSON_POOL.filter(id=>!S.owned.includes(id));
      if(avail.length){
        const lid=avail[Math.floor(Math.random()*avail.length)];
        S.owned.push(lid);S.flags.lessonGiven[R.m.id]=true;save();
        lessonCard=cardById(lid);
      }
    }
  }
  $('r-stamp').className='stamp '+(win?'win':'lose');
  $('r-stamp').textContent=win?'修復 完了':'再挑戦';
  $('r-detail').innerHTML=win
    ?`環境 ${R.env} ／ くらし ${R.life}。この傷は、ふさがった。<br><span class="stars">${starText(starsEarned)}</span>${skillPtGained?'<br>✨ この域の傷をすべて治し、<b>スキルポイント</b>を1つ得た。':''}${firstClear?'<br>✨ はじめての修復で、<b>スキルポイント</b>を1つ得た。':''}${(win&&R.m.boss&&R.m.boss.finale)?'<br>🌑 澱の気配が、ついに晴れた。':''}`
    :(detail||'目標に届かなかった。');
  $('r-learn').innerHTML=`<h4>📖 この傷が教えてくれたこと</h4>${R.m.learn}`;
  if(win&&R.m.part===2&&RESIDENTS[R.m.domain]){
    const res=RESIDENTS[R.m.domain];
    $('r-learn').innerHTML+=`<div class="goal-row resident-row" style="margin-top:10px"><b>🧑 ${res.name}（${res.role}）</b><div>${res.back}</div></div>`;
  }
  const rw=$('r-reward');const row=$('r-reward-row');row.innerHTML='';
  const rwLabel=$('r-reward-label');
  const acts=$('r-actions');acts.innerHTML='';
  const goHomeNow=()=>{closeResult();gotoHome(unlocked);};

  // 報酬：初クリア（最終ミッション以外）で未所持プールから2枚提示
  const picks=(win&&!wasCleared&&!R.m.finale)
    ? shuffle(REWARD_POOL.filter(id=>!S.owned.includes(id))).slice(0,2) : [];

  if(picks.length){
    rw.style.display='';
    rwLabel.textContent='✦ どちらか1枚を、旅の仲間に選ぼう ✦';
    let done=false;
    picks.forEach(id=>{
      const c=cardById(id);const node=elx('div','card');node.innerHTML=cardInner(c);
      node.onclick=()=>{
        if(done)return;done=true;
        node.classList.add('picked');
        row.querySelectorAll('.card').forEach(x=>{if(x!==node)x.classList.add('notpicked');});
        S.owned.push(id);save();
        // カードを選んだら詳細モーダルは出さず、ミッション選択画面へ戻る
        setTimeout(goHomeNow,FASTON()?20:700);
      };
      row.appendChild(node);
    });
    // 報酬提示中は「選ぶこと」が続行アクション（別途の戻るボタンは出さない）
  }else if(lessonCard){
    rw.style.display='';
    rwLabel.textContent='📔 挑戦の教訓を手に入れた ✦';
    const node=elx('div','card');node.innerHTML=cardInner(lessonCard);
    row.appendChild(node);
    const bRetry=elx('button','btn');bRetry.textContent='もう一度いどむ';
    bRetry.onclick=()=>{closeResult();startMission(R.m);};acts.appendChild(bRetry);
    const bHome=elx('button','btn ghost');bHome.textContent='地球へもどる';
    bHome.onclick=()=>{closeResult();gotoHome([]);};acts.appendChild(bHome);
  }else{
    rw.style.display='none';
    if(win){
      if(R.m.finale){
        const b=elx('button','btn');b.textContent='星の声を聴く ▸';b.onclick=()=>{closeResult();triggerEnding();};acts.appendChild(b);
      }else{
        const b=elx('button','btn'+(unlocked.length?' gold':''));
        b.textContent=unlocked.length?'新たな傷が見えた ▸':'地球へもどる';
        b.onclick=goHomeNow;acts.appendChild(b);
      }
    }else{
      const bRetry=elx('button','btn');bRetry.textContent='もう一度いどむ';
      bRetry.onclick=()=>{closeResult();startMission(R.m);};acts.appendChild(bRetry);
      const bHome=elx('button','btn ghost');bHome.textContent='地球へもどる';
      bHome.onclick=()=>{closeResult();gotoHome([]);};acts.appendChild(bHome);
    }
  }
  openOverlay('result-bg');
}

  $('heal-count').textContent=cl;$('dom-count').textContent=dm;

}
function wireMarkers(){
  const svg=$('earth-svg-slot');
  svg.querySelectorAll('.marker').forEach(g=>{
    const dom=g.getAttribute('data-dom');
    const act=()=>{
      const st=domainState(dom);
      if(st==='locked'){bumpHint('まだ手が届かない。別の傷を先に治そう。');shakeMarker(g);return;}
      openDomainSheet(dom);
    };
    g.onclick=act;
    g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}};
  });
  const wrap=$('earth-wrap');
  wrap.onclick=e=>{ if(e.target.closest('.marker'))return; wrap.classList.toggle('inspect'); };
}
function shakeMarker(g){g.style.transformOrigin='center';g.animate?g.animate([{transform:'translateX(0)'},{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}],{duration:300}):0;}
function bumpHint(t){const h=$('earth-hint');h.textContent=t;h.style.display='';setTimeout(()=>{if($('scr-home').classList.contains('active'))h.textContent='地球にふれて、傷をしらべる';},2200);}

function gotoHome(unlocked){
  showScreen('scr-home');
  renderHome();
  const afterBeams=()=>{
    if(S.cleared.length>=1&&!revealDone('skill'))setTimeout(()=>showReveal('skill'),FASTON()?10:400);
  };
  if(unlocked&&unlocked.length){
    setTimeout(()=>{fireUnlockBeams(unlocked);setTimeout(afterBeams,FASTON()?10:1400);},FASTON()?10:500);
  }else{
    setTimeout(afterBeams,FASTON()?10:300);
  }
}
function fireUnlockBeams(unlocked){
  const svg=$('earth-svg-slot');const beams=svg&&svg.querySelector('#beams');if(!beams)return;
  const src=DOMAINS[R.m.domain];
  let delay=0;
  unlocked.forEach(id=>{
    const m=missionById(id);const tgt=DOMAINS[m.domain];
    const len=Math.hypot(tgt.mx-src.mx,tgt.my-src.my)+1;
    const path=document.createElementNS('http://www.w3.org/2000/svg','line');
    path.setAttribute('x1',src.mx);path.setAttribute('y1',src.my);
    path.setAttribute('x2',tgt.mx);path.setAttribute('y2',tgt.my);
    path.setAttribute('class','beam');path.setAttribute('stroke-dasharray',len);
    path.style.setProperty('--blen',len);
    beams.appendChild(path);
    setTimeout(()=>{path.classList.add('fire');bumpHint('🔓 '+(m.unlockReason||(DOMAINS[m.domain].name+'の傷が見えた')));},delay);
    setTimeout(()=>path.remove(),delay+1700);
    delay+=FASTON()?12:1300;
  });
}

/* ---------- カード合成 ---------- */
function openSynth(){
  if(!S.flags.synthOpened){S.flags.synthOpened=true;save();renderHome();}
  const box=$('modal-box');
  const material=CARDS.filter(c=>(c.reward||c.lesson||c.chain)&&S.owned.includes(c.id));
  box.innerHTML=`<h3>🔬 合成</h3><div class="rule-body" style="text-align:center;margin-bottom:10px">
    手持ちのカードから2枚選んで、新しい1枚に合成する。</div>`;
  const grid=elx('div','coll-grid');
  const selected=[];
  material.forEach(c=>{
    const node=elx('div','card');node.innerHTML=cardInner(c);
    node.onclick=()=>{
      const i=selected.indexOf(c.id);
      if(i>=0){selected.splice(i,1);node.classList.remove('picked');}
      else if(selected.length<2){selected.push(c.id);node.classList.add('picked');}
      confirmBtn.disabled=selected.length!==2;
    };
    grid.appendChild(node);
  });
  box.appendChild(grid);
  const confirmBtn=elx('button','btn');confirmBtn.textContent='合成する(2枚えらぶ)';confirmBtn.disabled=true;
  confirmBtn.onclick=()=>{
    if(selected.length!==2)return;
    const pool=[...REWARD_POOL,...LESSON_POOL,...CHAIN_POOL].filter(id=>!S.owned.includes(id)&&!selected.includes(id));
    if(!pool.length){
      box.querySelector('.rule-body').insertAdjacentHTML('beforeend','<br><b>これ以上、新しく合成できるカードがない。</b>');
      return;
    }
    selected.forEach(id=>{const i=S.owned.indexOf(id);if(i>=0)S.owned.splice(i,1);});
    const newId=pool[Math.floor(Math.random()*pool.length)];
    S.owned.push(newId);save();
    const c=cardById(newId);
    box.innerHTML=`<h3>🔬 合成</h3><div class="rule-body" style="text-align:center">新しいカードが生まれた。</div>`;
    const node=elx('div','card');node.innerHTML=cardInner(c);
    const wrap=elx('div','coll-grid');wrap.appendChild(node);box.appendChild(wrap);
    const close=elx('button','btn');close.textContent='とじる';
    close.onclick=()=>{closeOverlay('modal-bg');
      if(!revealDone('chain'))setTimeout(()=>showReveal('chain'),300);};
    box.appendChild(close);
  };
  box.appendChild(confirmBtn);
  const close=elx('button','btn ghost');close.textContent='とじる';
  close.onclick=()=>{closeOverlay('modal-bg');
    if(!revealDone('chain'))setTimeout(()=>showReveal('chain'),300);};
  box.appendChild(close);
  openOverlay('modal-bg');
}

/* ---------- デッキ編集(手持ちカードの出し入れ) ---------- */

      node.onclick=()=>{
        const i=S.deckExclude.indexOf(c.id);
        if(i>=0)S.deckExclude.splice(i,1);else S.deckExclude.push(c.id);
        save();openDeckEditor();
      };
      grid.appendChild(node);
    });
    box.appendChild(grid);
  }
  if(baseUniq.length){
    const h2=elx('div','deck-sec');h2.textContent='📦 この傷にもとから備わるカード（固定）';box.appendChild(h2);
    const grid2=elx('div','coll-grid');
    baseUniq.forEach(id=>{
      const c=cardById(id);const n=baseIds.filter(x=>x===id).length;
      const node=elx('div','card base-card');
      node.innerHTML=cardInner(c)+(n>1?`<div class="dup-badge">×${n}</div>`:'');
      node.onclick=()=>openCardSheet({id});
      grid2.appendChild(node);
    });
    box.appendChild(grid2);
  }
  const close=elx('button','btn');close.textContent='とじる';
  close.onclick=()=>{closeOverlay('modal-bg');closeOverlay('sheet-bg');setTimeout(advanceRevealChain,300);};
  box.appendChild(close);
  openOverlay('modal-bg');
}

/* ---------- collection ---------- */
function openCollection(){
  const box=$('modal-box');
  const baseCards=CARDS.filter(c=>!c.variant);
  const owned=baseCards.filter(c=>(!c.reward&&!c.lesson&&!c.chain)||S.owned.includes(c.id));
  const total=baseCards.length,have=owned.length;
  box.innerHTML=`<h3>🗂️ カード帳</h3><div class="coll-count">${have} / ${total} 種を集めた</div>`;
  const grid=elx('div','coll-grid');
  baseCards.forEach(c=>{
    const locked=(c.reward||c.lesson||c.chain)&&!S.owned.includes(c.id);
    const node=elx('div','card'+(locked?' locked-card':''));
    const lockLabel=c.lesson?'教訓':c.chain?'スキル':'報酬';
    node.innerHTML=locked?`<div class="c-icon">❔</div><div class="c-name">？？？</div><div class="c-tag ${TAGS[c.tag].cls}">${lockLabel}</div><div class="c-fx">${c.lesson?'挑戦の教訓':c.chain?'スキルの実り':'修復の報酬'}</div>`:cardInner(c);
    if(!locked)node.onclick=()=>openCardSheet({id:c.id});
    grid.appendChild(node);
  });
  box.appendChild(grid);
  const close=elx('button','btn ghost');close.textContent='とじる';close.onclick=()=>closeOverlay('modal-bg');
  box.appendChild(close);
  openOverlay('modal-bg');
}

/* ---------- menu ---------- */
function openMenu(fromPlay){
  const box=$('modal-box');box.innerHTML='<h3>メニュー</h3>';
  const rules=elx('button','btn ghost');rules.textContent='📖 あそびかた';rules.onclick=showRules;box.appendChild(rules);
  if(fromPlay){const quit=elx('button','btn ghost');quit.textContent='🏳️ 修復を中断して地球へ';
    quit.onclick=()=>{closeOverlay('modal-bg');uiConfirm('中断しますか？','この傷の進みは失われます。',()=>{R.over=true;gotoHome([]);},'中断する');};box.appendChild(quit);}
  const reset=elx('button','btn ghost');reset.textContent='🔄 はじめから';
  reset.onclick=()=>uiConfirm('最初から読み直しますか？','これまでの修復と手紙は、すべて最初に戻ります。',()=>{resetSave();closeOverlay('modal-bg');startIntro();},'最初から');
  box.appendChild(reset);
  const close=elx('button','btn');close.textContent='とじる';close.onclick=()=>closeOverlay('modal-bg');box.appendChild(close);
  openOverlay('modal-bg');
}
function showRules(){
  const box=$('modal-box');
  box.innerHTML=`<h3>あそびかた</h3>
   <div class="rule-body">
   🌍 <b>地球</b>の9つのマーカーが、9種類の傷。ふれると<b>前編・後編</b>をえらべます。<br>
   🃏 手札のカードを<b>盤面へドラッグ</b>して実行。タップで詳しく読めます。<br>
   📊 <b>環境</b>を目標まで上げれば修復成功。後編は<b>くらし</b>も保つ必要があります。<br>
   🌤️ 盤面の<b>見通し</b>は、来年の環境の増減。負荷を減らし、保全を増やそう。<br>
   🔗 <b>直前に出したカード</b>と相性がよいカードを出すと<b>コンボ</b>。<br>
   🧩 「ずっと」続く効果は、種類ごとに<b>3つまで</b>。いっぱいのときは、ひとつ入れ替えて設置しよう。<br>
   ⚠️ 環境が下がりすぎると<b>ティッピングポイント</b>を超え、負荷が元に戻らず重くなる。<br>
   📔 修復に失敗しても、はじめての失敗では<b>教訓カード</b>を手に入れて再挑戦できる。<br>
   🌑 後編には「澱」が現れる。1年前に気配が見えるので、備えておこう。<br>
   ⭐ 修復に成功すると、余裕の大きさに応じて<b>評価(★1〜3)</b>がつく。<br>
   🔓 傷を治すと、つながった<b>別の傷</b>が解放されます(複数のことも)。<br>
   ✉️ 手紙の謎は、すべての傷を治したときに——。
   </div>`;
  const close=elx('button','btn');close.textContent='とじる';close.onclick=()=>closeOverlay('modal-bg');box.appendChild(close);
  openOverlay('modal-bg');
}

/* ---------- wire static buttons ---------- */
function wireButtons(){
  $('intro-tap').onclick=()=>{$('parcel-wrap').click();};
  $('btn-coll').onclick=openCollection;
  $('btn-skill').onclick=openSkillTree;
  $('btn-synth').onclick=openSynth;
  $('btn-home-menu').onclick=()=>openMenu(false);
  $('btn-menu').onclick=()=>openMenu(true);
  $('btn-sheet-close').onclick=()=>closeOverlay('sheet-bg');
  $('btn-sheet-play').onclick=()=>{
    closeOverlay('sheet-bg');
    if(sheetCard&&R&&!R.over&&R.hand.some(h=>h.uid===sheetCard.uid)){const b=$('board').getBoundingClientRect();playCardByUid(sheetCard.uid,b.width/2,b.height/2);}
  };
  $('btn-dom-close').onclick=()=>closeOverlay('dom-bg');
  $('btn-brief-close').onclick=()=>closeOverlay('brief-bg');
  $('btn-brief-go').onclick=()=>{closeOverlay('brief-bg');startMission(briefMission);};
  $('btn-brief-deck').onclick=openDeckEditor;
  $('btn-hint').onclick=showHint;
  $('btn-end-restart').onclick=()=>uiConfirm('はじめから読み直しますか？','すべての修復と手紙が、最初に戻ります。',()=>{resetSave();startIntro();},'最初から');
}

/* ---------- BOOT ---------- */
function BOOT(){
  sizeBgCanvas();window.addEventListener('resize',sizeBgCanvas);wireButtons();load();
  if(S.stance&&S.cleared.length>0){gotoHome([]);}
  else if(S.stance){gotoHome([]);}
  else{startIntro();}
}

/* test / debug hooks */
if(typeof window!=='undefined'){
  window.STE={
    get S(){return S;}, get R(){return R;},
    state:()=>({stance:S.stance,cleared:S.cleared.slice(),owned:S.owned.slice(),
      run:R?{env:R.env,life:R.life,turn:R.turn,maxTurns:R.maxTurns,over:R.over,busy:R.busy,hand:R.hand.map(h=>h.uid)}:null}),
    isBusy:()=>!!(R&&R.busy),
    missionState,domainState,missionById,startMission,openBrief,openDomainSheet,
    playByUid:(uid,x,y)=>playCardByUid(uid,x||60,y||60),
    playFirst:()=>{if(R&&R.hand[0])return playCardByUid(R.hand[0].uid,60,60);},
    setStance:k=>{S.stance=k;save();},
    forceClear:id=>{if(!S.cleared.includes(id))S.cleared.push(id);save();},
    gotoHome:()=>gotoHome([]),
    reset:()=>resetSave(),
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',BOOT);else BOOT();
}

</script>
</body>
</html>
